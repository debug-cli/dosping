[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dosping"
version = "3.7.1"
description = "Network Stress Testing TUI"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[project.scripts]
dosping = "dosping:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["dosping", "flooder", "scanner", "config", "theme", "settings", "eventlog"]
